name: Reporte de bug
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: ¿Qué pasó?
      description: Describe el problema y qué esperabas que pasara.
    validations:
      required: true
  - type: textarea
    id: codigo
    attributes:
      label: Código mínimo que lo reproduce
      description: El programa `.ggez` más pequeño posible que muestra el problema.
      render: text
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir el archivo...
        2. Presionar Ejecutar...
        3. Ver el error en la terminal...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión
      placeholder: v1.1
    validations:
      required: true
  - type: dropdown
    id: so
    attributes:
      label: Sistema operativo
      options:
        - Windows
        - Linux
        - NixOS
    validations:
      required: true
