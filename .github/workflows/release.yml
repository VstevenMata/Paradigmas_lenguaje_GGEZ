# Al fusionar a main: si la <Version> del .csproj no tiene tag todavía, genera GGEZ y GGEZ.exe
# con publicar.sh, crea el tag vX.Y y publica el release que descargan instalar.sh e instalar.ps1.
# Después abre un PR que apunta flake.nix al release nuevo. Si la versión no cambió, no hace nada.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Dos merges seguidos no publican el mismo release dos veces
concurrency: release

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: leer
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' ParadigmasLenguajePropio/src/ParadigmasLenguajePropio/ParadigmasLenguajePropio.csproj)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "nuevo=false" >> "$GITHUB_OUTPUT"
            echo "v$version ya existe; no se publica nada"
          else
            echo "nuevo=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.leer.outputs.nuevo == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Con dotnet en el PATH, publicar.sh no usa nix
      - if: steps.leer.outputs.nuevo == 'true'
        run: ./publicar.sh todo
      # Crea el tag en el commit del merge y el release con los ejecutables
      - if: steps.leer.outputs.nuevo == 'true'
        run: gh release create "v$VERSION" dist/GGEZ dist/GGEZ.exe --target "$GITHUB_SHA" --title "GGEZ $VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.leer.outputs.version }}
      # nix baja un ejecutable fijo con su hash: un PR lo cambia al release nuevo (hash SRI = sha256 en base64)
      - if: steps.leer.outputs.nuevo == 'true'
        run: |
          hash="sha256-$(openssl dgst -sha256 -binary dist/GGEZ | base64)"
          sed -i -E "s#download/v[^/]+/GGEZ#download/v$VERSION/GGEZ#; s#hash = \"sha256-[^\"]+\"#hash = \"$hash\"#" flake.nix
          git switch -c "chore/flake-v$VERSION"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -am "chore: flake.nix apunta a v$VERSION"
          git push origin "chore/flake-v$VERSION"
          gh pr create --base main --head "chore/flake-v$VERSION" --title "chore: flake.nix apunta a v$VERSION" --body "PR automático del release v$VERSION para que NixOS instale la versión nueva."
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.leer.outputs.version }}
