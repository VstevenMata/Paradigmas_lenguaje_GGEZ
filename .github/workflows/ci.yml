# En cada PR compila el IDE y verifica la salida de los ejemplos del traductor. El PR muestra ✅ o ❌ antes de fusionar.
name: CI

on:
  pull_request:

# Si se sube otro commit al mismo PR, cancela la revisión anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: dotnet build ParadigmasLenguajePropio/ParadigmasLenguajePropio.sln
      # Corre cada ejemplo y compara su salida con Traductor/ejemplos/esperado/<nombre>.txt
      - run: python Traductor/verificar_ejemplos.py
